<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#059669" flood-opacity="0.18" />
    </filter>
  </defs>

  <circle cx="250" cy="175" r="130" fill="#ecfdf5" />
  
  <!-- Central Big Shield -->
  <g filter="url(#shieldShadow)">
    <path d="M 250 80 L 170 120 V 195 C 170 245 205 275 250 290 C 295 275 330 245 330 195 V 120 Z" fill="#ffffff" stroke="#a7f3d0" stroke-width="3" />
    <path d="M 250 95 L 185 128 V 190 C 185 230 215 255 250 270 C 285 255 315 230 315 190 V 128 Z" fill="url(#shieldGrad)" />
    <!-- White Checkmark -->
    <path d="M 225 185 L 242 202 L 278 162" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Left Floating Demography Card -->
  <g filter="url(#shieldShadow)">
    <rect x="80" y="140" width="115" height="55" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="100" cy="167" r="10" fill="#f0f9ff" />
    <text x="116" y="164" font-family="sans-serif" font-weight="bold" font-size="9" fill="#0f172a">Gender Netral</text>
    <text x="116" y="175" font-family="sans-serif" font-size="8" fill="#059669">Gap &lt; 0.36%</text>
  </g>

  <!-- Right Floating Age Group Card -->
  <g filter="url(#shieldShadow)">
    <rect x="310" y="140" width="115" height="55" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="330" cy="167" r="10" fill="#fef3c7" />
    <text x="346" y="164" font-family="sans-serif" font-weight="bold" font-size="9" fill="#0f172a">Pediatrik 0-17</text>
    <text x="346" y="175" font-family="sans-serif" font-size="8" fill="#059669">FPR Terendah 4.1%</text>
  </g>
</svg>
