<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Abstract Tech Shapes -->
  <circle cx="250" cy="175" r="140" fill="#ecfdf5" opacity="0.8" />
  <circle cx="390" cy="80" r="45" fill="#f0f9ff" opacity="0.7" />
  <rect x="70" y="220" width="60" height="60" rx="16" fill="#f1f5f9" />

  <!-- Base Dashboard Canvas Window -->
  <rect x="100" y="60" width="300" height="210" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" filter="url(#softShadow)" />
  
  <!-- Window Header Bar -->
  <rect x="100" y="60" width="300" height="36" rx="16" fill="#f8fafc" />
  <rect x="100" y="86" width="300" height="10" fill="#f8fafc" />
  <line x1="100" y1="96" x2="400" y2="96" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="120" cy="78" r="4" fill="#ef4444" />
  <circle cx="132" cy="78" r="4" fill="#f59e0b" />
  <circle cx="144" cy="78" r="4" fill="#10b981" />
  <rect x="180" y="72" width="140" height="12" rx="6" fill="#e2e8f0" />

  <!-- Chart Inside Window -->
  <rect x="125" y="120" width="22" height="110" rx="4" fill="#e2e8f0" />
  <rect x="155" y="150" width="22" height="80" rx="4" fill="#e2e8f0" />
  <rect x="185" y="105" width="22" height="125" rx="4" fill="url(#primaryGrad)" />
  <rect x="215" y="165" width="22" height="65" rx="4" fill="#e2e8f0" />
  <rect x="245" y="135" width="22" height="95" rx="4" fill="url(#primaryGrad)" />
  
  <!-- Mini Trend Line -->
  <path d="M 136 120 Q 170 80 196 105 T 256 135" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <circle cx="196" cy="105" r="5" fill="#ffffff" stroke="#059669" stroke-width="2.5" />

  <!-- Top Floating Card (Audit 5% Tag) -->
  <g filter="url(#softShadow)">
    <rect x="250" y="120" width="170" height="75" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
    <circle cx="275" cy="148" r="14" fill="#ecfdf5" />
    <path d="M 270 148 L 273 152 L 280 144" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="296" y="138" width="70" height="8" rx="4" fill="#0f172a" />
    <rect x="296" y="152" width="105" height="6" rx="3" fill="#94a3b8" />
    <rect x="296" y="164" width="50" height="14" rx="4" fill="#fef2f2" />
    <text x="302" y="174" font-family="sans-serif" font-size="8" font-weight="bold" fill="#dc2626">Top 5% Audit</text>
  </g>

  <!-- Bottom Floating Badge (Shield) -->
  <g filter="url(#softShadow)">
    <circle cx="95" cy="180" r="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="95" cy="180" r="22" fill="#ecfdf5" />
    <path d="M 95 168 L 84 173 V 183 C 84 189 89 193 95 195 C 101 193 106 189 106 183 V 173 Z" fill="url(#primaryGrad)" />
    <path d="M 91 181 L 94 184 L 100 178" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
