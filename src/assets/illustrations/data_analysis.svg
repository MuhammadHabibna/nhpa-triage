<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Bubble -->
  <circle cx="260" cy="170" r="135" fill="#f0fdf4" />
  
  <!-- Desk/Platform -->
  <rect x="60" y="270" width="380" height="8" rx="4" fill="#e2e8f0" />
  
  <!-- Large Screen Monitor -->
  <rect x="110" y="70" width="280" height="180" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <rect x="225" y="250" width="50" height="20" fill="#cbd5e1" />
  <rect x="200" y="266" width="100" height="6" rx="3" fill="#94a3b8" />
  
  <!-- Content in Monitor -->
  <rect x="130" y="90" width="90" height="12" rx="4" fill="#0f172a" />
  <rect x="130" y="110" width="140" height="6" rx="3" fill="#94a3b8" />
  
  <!-- Analytics Grid -->
  <rect x="130" y="130" width="110" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <!-- Donut Inside Screen -->
  <circle cx="185" cy="177" r="30" fill="none" stroke="#e2e8f0" stroke-width="10" />
  <circle cx="185" cy="177" r="30" fill="none" stroke="#059669" stroke-width="10" stroke-dasharray="140 188" stroke-dashoffset="0" />
  <text x="185" y="182" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0f172a">98%</text>

  <!-- Right Side Lines -->
  <rect x="260" y="130" width="110" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <line x1="275" y1="190" x2="355" y2="190" stroke="#e2e8f0" stroke-width="1" />
  <line x1="275" y1="160" x2="355" y2="160" stroke="#e2e8f0" stroke-width="1" />
  <path d="M 275 190 Q 300 145 320 170 T 355 140" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Badge Right -->
  <g filter="url(#shadow)">
    <rect x="340" y="95" width="110" height="50" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
    <circle cx="360" cy="120" r="10" fill="#ecfdf5" />
    <path d="M 357 120 L 359 122 L 364 117" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="375" y="117" font-family="sans-serif" font-weight="bold" font-size="9" fill="#0f172a">7 Fase EDA</text>
    <text x="375" y="128" font-family="sans-serif" font-size="7.5" fill="#64748b">Forensic Audit</text>
  </g>
</svg>
